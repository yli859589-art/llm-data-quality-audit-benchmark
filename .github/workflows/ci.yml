name: checks

on:
  push:
  pull_request:

env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Repository hygiene
        run: python scripts/check_repo.py --clean
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: black --check .
      - name: Type check
        run: mypy src/course_project_suite/llm_benchmark
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Quick benchmark smoke test
        run: python scripts/run_quick_experiment.py
      - name: Dataset matrix smoke test
        run: |
          python scripts/run_dataset_matrix.py --mode quick
          python scripts/run_dataset_matrix.py --mode paper-prototype
          python scripts/run_multi_seed.py --mode paper-prototype
          python scripts/run_model_scaling.py
      - name: Regenerate tables and figures
        run: |
          python scripts/make_tables.py
          python scripts/make_figures.py
          python scripts/statistical_analysis.py
          python scripts/make_research_tables.py
          python scripts/make_research_figures.py
          python scripts/analyze_failures.py
          python scripts/make_project_report.py
          python scripts/check_artifacts.py
      - name: Python compile check
        run: python scripts/run_verification.py
