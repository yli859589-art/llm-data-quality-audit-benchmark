repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.8
    hooks:
      - id: ruff
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
  - repo: local
    hooks:
      - id: main-mypy
        name: main benchmark type check
        entry: mypy src/course_project_suite/llm_benchmark
        language: system
        pass_filenames: false
      - id: repository-hygiene
        name: repository hygiene
        entry: python scripts/check_repo.py
        language: system
        pass_filenames: false
