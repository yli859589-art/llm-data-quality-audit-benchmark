[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-data-quality-attention-benchmark-suite"
version = "4.5.0"
description = "Reproducible research prototype for data-quality interventions in small-scale language-model pretraining."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "YuHan Li"}]
dependencies = ["numpy>=1.23", "torch>=2.0", "PyYAML>=6.0"]
keywords = ["machine-learning", "language-modeling", "data-quality", "attention", "benchmark", "nlp"]

[project.optional-dependencies]
data = ["datasets>=2.14"]
tokenizers = ["transformers>=4.38"]
reports = ["matplotlib>=3.7"]
ui = ["streamlit>=1.32"]
dev = ["black==25.1.0", "coverage>=7.0", "mypy>=1.10", "pre-commit>=4.0", "pytest>=8.0", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '''
/(
  artifacts
  | data
  | projects
  | src/course_project_suite/(cs188|cs224n|cs229|cs231n|cs336)
  | src/course_project_suite/common.py
  | src/course_project_suite/run_all.py
  | all_course_projects.py
  | tests/test_algorithm_edges.py
  | tests/test_smoke.py
)/
'''

[tool.pytest.ini_options]
pythonpath = ["src", "."]
cache_dir = "test_tmp/pytest_cache"
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
